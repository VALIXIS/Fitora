<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitora - Fitness & Wellness Tracking</title>
  <style>
    :root {
      --bg-color: #050816;
      --card-bg: #0d1326;
      --accent-color: #00F2FE;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --border-color: #1E293B;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 32px;
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      color: var(--accent-color);
      font-size: 36px;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
    }
    .links {
      margin-top: 32px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--accent-color);
      color: #000000;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      margin: 8px;
    }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fitora</h1>
    <p>Your Ultimate AI-Powered Personal Fitness & Wellness Companion</p>
    <div class="links">
      <a href="/privacy-policy.html" class="btn">View Privacy Policy</a>
      <a href="/app-ads.txt" class="btn" style="background-color: transparent; color: var(--accent-color); border: 1px solid var(--accent-color);">View app-ads.txt</a>
    </div>
    <div class="footer">
      © 2026 Fitora by VALIXIS. All Rights Reserved.
    </div>
  </div>
</body>
</html>
